name: Blog — Noticia Diaria

on:
  schedule:
    # 14:00 UTC = 09:00 CDT / 08:00 CST (Ciudad de México)
    - cron: '0 14 * * *'
    # Respaldo: si el de 14:00 falla por infraestructura de GitHub, reintenta a las 15:00
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Tema específico (opcional)'
        required: false
        default: ''
      categoria:
        description: 'Categoría: Tip RH | Alerta Legal | Jurisprudencia | Noticias | Reforma Laboral'
        required: false
        default: ''

jobs:
  daily-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar si ya existe noticia de hoy
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          EXISTING=$(node -e "
            const posts = require('./blog/posts.json');
            const t = posts.find(p => p.fecha === '$TODAY' && p.tipo === 'noticia');
            if (t) { process.stdout.write(t.slug); }
          " 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ Noticia del $TODAY ya publicada: $EXISTING — nada que hacer."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "📝 No hay noticia para $TODAY — procediendo a generar."
          fi

      - name: Generar noticia diaria
        if: steps.check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--tipo noticia"
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            ARGS="$ARGS --topic \"${{ github.event.inputs.topic }}\""
          fi
          if [ -n "${{ github.event.inputs.categoria }}" ]; then
            ARGS="$ARGS --categoria \"${{ github.event.inputs.categoria }}\""
          fi
          eval node .github/scripts/generate-blog-post.js $ARGS

      - name: Commit y push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "ClickLaboral Bot"
          git config user.email "bot@clicklaboral.mx"
          git add blog/
          git diff --staged --quiet || git commit -m "🗞️ Noticia diaria: $(date -u +%Y-%m-%d)"
          git push

      - name: Trigger Netlify rebuild
        if: steps.check.outputs.skip != 'true' && env.NETLIFY_BUILD_HOOK != ''
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: curl -s -X POST "$NETLIFY_BUILD_HOOK"
