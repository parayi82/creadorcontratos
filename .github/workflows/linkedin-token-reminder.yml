name: LinkedIn — Recordatorio renovación de token

on:
  schedule:
    # Corre cada 1ro del mes a las 10:00am CST
    - cron: '0 16 1 * *'
  workflow_dispatch:

jobs:
  check-token-expiry:
    name: Verificar vigencia del token de LinkedIn
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verificar que el token existe y emitir recordatorio
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          if [ -z "$LINKEDIN_ACCESS_TOKEN" ]; then
            echo "⚠️  LINKEDIN_ACCESS_TOKEN no configurado en Secrets."
            echo ""
            echo "Para configurarlo:"
            echo "1. Ir a LinkedIn Developer Portal: https://www.linkedin.com/developers/"
            echo "2. Generar nuevo token con scope w_member_social"
            echo "3. Ir a GitHub → Settings → Secrets → Actions → LINKEDIN_ACCESS_TOKEN"
            exit 1
          fi

          echo "✅ Token presente. Recordatorio: los tokens de LinkedIn expiran cada 60 días."
          echo ""
          echo "Si el workflow de publicación empieza a fallar con error 401,"
          echo "renueva el token en LinkedIn Developer Portal y actualiza el secreto en GitHub."
          echo ""
          echo "Guía de renovación:"
          echo "  https://www.linkedin.com/developers/tools/oauth/token-generator"

      - name: Resumen
        run: |
          echo "### LinkedIn Token Reminder" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Los tokens de LinkedIn expiran cada **60 días**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Si el workflow de publicación falla con error 401:" >> $GITHUB_STEP_SUMMARY
          echo "1. Ir a https://www.linkedin.com/developers/tools/oauth/token-generator" >> $GITHUB_STEP_SUMMARY
          echo "2. Generar nuevo token con scope \`w_member_social\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Actualizar el secreto \`LINKEDIN_ACCESS_TOKEN\` en GitHub Settings → Secrets" >> $GITHUB_STEP_SUMMARY
