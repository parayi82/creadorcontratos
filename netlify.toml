# Caché largo para assets estáticos con cache-busting en URL
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML nunca en caché
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# RSS feed — tipo MIME correcto y caché corto
[[headers]]
  for = "/blog/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

# Las funciones con schedule en Netlify bloquean acceso HTTP externo (solo el
# scheduler interno puede invocarlas). Se usa cron-job.org para disparar las
# funciones vía HTTP con Authorization header, lo que mantiene acceso manual
# para pruebas y no requiere configuración adicional de Netlify.
    Cache-Control = "public, max-age=3600"
