# ── Bloqueo de archivos internos ──────────────────────────────────────────────
# publish = "." sirve TODO el directorio. Sin estas reglas, cualquiera podía
# descargar el esquema completo de la base de datos abriendo, por ejemplo,
# https://clicklaboral.mx/EJECUTAR-EN-SUPABASE.sql
# robots.txt no sirve para esto: solo pide a los buscadores que no indexen,
# no impide la descarga directa.
# force = true es indispensable — sin él, el archivo existente gana sobre la regla.

[[redirects]]
  from = "/*.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/_db/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/_interno/*"
  to = "/index.html"
  status = 404
  force = true

# ── Headers de seguridad ──────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://js.stripe.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://api.stripe.com https://api.resend.com https://www.facebook.com; frame-src https://js.stripe.com https://hooks.stripe.com https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-site"

# Headers adicionales para rutas de API — bloquea acceso directo desde navegador sin Origin
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache, must-revalidate"

# Bloquear .env y archivos de configuración sensibles
[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package*.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
