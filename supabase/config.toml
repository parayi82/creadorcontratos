# Supabase CLI — configuración del proyecto ClickLaboral
# Docs: https://supabase.com/docs/guides/local-development

[api]
# Puerto local del emulador de Supabase (solo desarrollo local)
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Puerto local de Postgres (solo desarrollo local)
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
# El site_url se sobreescribe por SUPABASE_AUTH_EXTERNAL_URL en Netlify
site_url = "https://clicklaboral.mx"
additional_redirect_urls = [
  "https://www.clicklaboral.mx",
  "http://localhost:3000",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[analytics]
enabled = false
