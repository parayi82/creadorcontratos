<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 400; font-style: normal; src: url('assets/fonts/pjs-400.woff2') format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 600; font-style: normal; src: url('assets/fonts/pjs-600.woff2') format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 700; font-style: normal; src: url('assets/fonts/pjs-700.woff2') format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFFFFF; font-family: "Plus Jakarta Sans", sans-serif; }

      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        container-type: size;
        overflow: hidden;
        background: #FFFFFF;
      }

      /* Top bar — logo */
      #top-bar {
        position: absolute;
        top: 5cqh;
        left: 5cqw;
        right: 5cqw;
        display: flex;
        align-items: center;
        gap: 1.5cqw;
        z-index: 10;
      }
      #logo-dot {
        width: 3cqw;
        height: 3cqw;
        background: #005AC8;
        border-radius: 50%;
        flex-shrink: 0;
      }
      #logo-text {
        font-size: 2.2cqw;
        font-weight: 700;
        color: #1D1D1F;
        letter-spacing: -0.01em;
      }

      /* Visual content area — stress illustration */
      #visual-area {
        position: absolute;
        top: 12cqh;
        left: 0;
        right: 0;
        height: 52cqh;
        background: linear-gradient(160deg, #f8f4f0 0%, #fff5f5 60%, #ffeaea 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      /* Abstract stress visuals */
      .stress-doc {
        position: absolute;
        background: #FFFFFF;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      }
      #doc-1 { width: 28cqw; height: 36cqh; top: 2cqh; left: 5cqw; transform: rotate(-8deg); }
      #doc-2 { width: 28cqw; height: 36cqh; top: 4cqh; left: 16cqw; transform: rotate(-2deg); }
      #doc-3 { width: 28cqw; height: 36cqh; top: 6cqh; left: 27cqw; transform: rotate(5deg); }
      #doc-4 { width: 28cqw; height: 36cqh; top: 3cqh; right: 8cqw; transform: rotate(9deg); }

      .doc-line { height: 1.2cqh; background: rgba(0,0,0,0.12); border-radius: 2px; margin: 1.8cqh 2cqw; }
      .doc-line-short { width: 60%; }
      .doc-line-medium { width: 80%; }
      .doc-line-full { width: 90%; }

      /* Red alert stamp */
      #alert-stamp {
        position: absolute;
        top: 18cqh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: #dc2626;
        color: #FFFFFF;
        font-size: 2cqw;
        font-weight: 700;
        padding: 1.2cqh 3cqw;
        border-radius: 8px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-align: center;
        box-shadow: 0 4px 16px rgba(220,38,38,0.4);
      }

      /* Big number */
      #big-number {
        position: absolute;
        top: 24cqh;
        left: 0;
        right: 0;
        text-align: center;
        z-index: 5;
      }
      #pct-value {
        font-size: 22cqw;
        font-weight: 700;
        color: #005AC8;
        line-height: 1.0;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
        opacity: 0.9;
        transform-origin: 50% 100%;
      }
      #pct-label {
        font-size: 2.8cqw;
        font-weight: 600;
        color: #1D1D1F;
        letter-spacing: -0.01em;
        margin-top: 0.5cqh;
        text-align: center;
        line-height: 1.3;
      }

      /* Warning badge */
      #warning-badge {
        position: absolute;
        top: 62cqh;
        left: 5cqw;
        right: 5cqw;
        background: rgba(220,38,38,0.08);
        border: 2px solid rgba(220,38,38,0.3);
        border-radius: 12px;
        padding: 2cqh 3cqw;
        display: flex;
        align-items: center;
        gap: 2cqw;
      }
      #warning-icon {
        font-size: 5cqw;
        flex-shrink: 0;
      }
      #warning-text {
        font-size: 2.5cqw;
        font-weight: 700;
        color: #dc2626;
        line-height: 1.3;
      }

      /* Bottom gradient for subtitle legibility */
      .bottom-gradient {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 42cqh;
        background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.5) 55%, transparent 100%);
        pointer-events: none;
      }

      /* Hormozi-style subtitle */
      #subtitle {
        position: absolute;
        bottom: 7cqh;
        left: 4cqw;
        right: 4cqw;
        text-align: center;
        z-index: 20;
      }
      .sub-line {
        display: block;
        font-size: 4.2cqw;
        font-weight: 700;
        color: #FFFFFF;
        text-shadow: 2px 2px 6px rgba(0,0,0,1), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        line-height: 1.35;
      }
      .sub-highlight {
        color: #FFD700;
      }

      /* Progress bar */
      .progress-track { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.15); }
      #progress-fill { height: 100%; background: #005AC8; width: 0%; }

      /* Frame counter */
      .frame-counter { position: absolute; bottom: 1cqh; right: 4cqw; font-size: 1.4cqw; font-weight: 500; color: rgba(255,255,255,0.5); z-index: 30; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="01-hook"
      data-start="0"
      data-duration="7"
      data-width="1080"
      data-height="1920"
    >
      <!-- Logo top -->
      <div id="top-bar" class="clip" data-start="0" data-duration="7" data-track-index="1">
        <div id="logo-dot"></div>
        <span id="logo-text">ClickLaboral.mx</span>
      </div>

      <!-- Visual: papers chaos -->
      <div id="visual-area" aria-hidden="true">
        <div class="stress-doc" id="doc-1">
          <div class="doc-line doc-line-full"></div>
          <div class="doc-line doc-line-medium"></div>
          <div class="doc-line doc-line-short"></div>
          <div class="doc-line doc-line-full"></div>
          <div class="doc-line doc-line-medium"></div>
        </div>
        <div class="stress-doc" id="doc-2">
          <div class="doc-line doc-line-medium"></div>
          <div class="doc-line doc-line-full"></div>
          <div class="doc-line doc-line-short"></div>
          <div class="doc-line doc-line-full"></div>
          <div class="doc-line doc-line-medium"></div>
        </div>
        <div class="stress-doc" id="doc-3">
          <div class="doc-line doc-line-full"></div>
          <div class="doc-line doc-line-short"></div>
          <div class="doc-line doc-line-full"></div>
          <div class="doc-line doc-line-medium"></div>
          <div class="doc-line doc-line-short"></div>
        </div>
        <div class="stress-doc" id="doc-4">
          <div class="doc-line doc-line-medium"></div>
          <div class="doc-line doc-line-full"></div>
          <div class="doc-line doc-line-full"></div>
          <div class="doc-line doc-line-short"></div>
          <div class="doc-line doc-line-medium"></div>
        </div>
      </div>

      <!-- Big stat -->
      <div id="big-number" class="clip" data-start="0" data-duration="7" data-track-index="2">
        <div id="pct-value">80%</div>
        <div id="pct-label" data-layout-allow-occlusion data-layout-allow-overlap>de empresas pierde<br>demandas laborales</div>
      </div>

      <!-- Warning badge -->
      <div id="warning-badge" class="clip" data-start="0" data-duration="7" data-track-index="3">
        <span id="warning-icon">⚠️</span>
        <span id="warning-text">Sin papeles en regla = multas + indemnizaciones millonarias</span>
      </div>

      <!-- Bottom gradient -->
      <div class="bottom-gradient"></div>

      <!-- Subtitle -->
      <div id="subtitle" class="clip" data-start="0" data-duration="7" data-track-index="4">
        <span class="sub-line">¿Sabías que <span class="sub-highlight">más del 80%</span></span>
        <span class="sub-line">de empresas en México</span>
        <span class="sub-line">pierde juicios laborales?</span>
      </div>

      <!-- Chrome -->
      <div class="frame-counter">1/6</div>
      <div class="progress-track">
        <div id="progress-fill"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Logo
      tl.from("#top-bar", { opacity: 0, y: -20, duration: 0.4, ease: "power2.out" }, 0);

      // Docs scatter
      tl.from("#doc-1", { opacity: 0, rotate: -20, scale: 0.8, duration: 0.5, ease: "back.out(1.2)" }, 0.2);
      tl.from("#doc-2", { opacity: 0, rotate: 10, scale: 0.8, duration: 0.5, ease: "back.out(1.2)" }, 0.35);
      tl.from("#doc-3", { opacity: 0, rotate: -5, scale: 0.8, duration: 0.5, ease: "back.out(1.2)" }, 0.5);
      tl.from("#doc-4", { opacity: 0, rotate: 15, scale: 0.8, duration: 0.5, ease: "back.out(1.2)" }, 0.65);

      // Big number slams in
      tl.from("#pct-value", { opacity: 0, scale: 1.5, duration: 0.6, ease: "back.out(1.6)" }, 0.8);
      tl.from("#pct-label", { opacity: 0, y: 20, duration: 0.4, ease: "power2.out" }, 1.3);

      // Warning badge
      tl.from("#warning-badge", { opacity: 0, x: -40, duration: 0.5, ease: "power2.out" }, 1.8);

      // Subtitle
      tl.from("#subtitle", { opacity: 0, y: 25, duration: 0.5, ease: "power2.out" }, 2.4);

      // Progress 0% → 11.7%
      tl.fromTo("#progress-fill", { width: "0%" }, { width: "11.7%", duration: 7, ease: "none" }, 0);

      window.__timelines["01-hook"] = tl;
    </script>
  </body>
</html>
