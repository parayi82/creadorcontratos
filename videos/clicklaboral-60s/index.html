<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 400; font-style: normal; src: url('assets/fonts/pjs-400.woff2') format('woff2'), local('Plus Jakarta Sans'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 600; font-style: normal; src: url('assets/fonts/pjs-600.woff2') format('woff2'), local('Plus Jakarta Sans'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 700; font-style: normal; src: url('assets/fonts/pjs-700.woff2') format('woff2'), local('Plus Jakarta Sans'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFFFFF; font-family: "Plus Jakarta Sans", sans-serif; }

      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        container-type: size;
        overflow: hidden;
        background: #FFFFFF;
      }

      .clip {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="clicklaboral-60s"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scene 1: Hook (0–7s) -->
      <div
        id="scene-hook"
        class="clip"
        data-start="0"
        data-duration="7"
        data-composition-id="scene-hook-host"
        data-composition-src="compositions/frames/01-hook.html"
        data-track-index="1"
      ></div>

      <!-- Scene 2: Dashboard (7–18s) -->
      <div
        id="scene-dashboard"
        class="clip"
        data-start="7"
        data-duration="11"
        data-composition-id="scene-dashboard-host"
        data-composition-src="compositions/frames/02-dashboard.html"
        data-track-index="1"
      ></div>

      <!-- Scene 3: Contratos (18–32s) -->
      <div
        id="scene-contratos"
        class="clip"
        data-start="18"
        data-duration="14"
        data-composition-id="scene-contratos-host"
        data-composition-src="compositions/frames/03-contratos.html"
        data-track-index="1"
      ></div>

      <!-- Scene 4: Cumplimiento (32–45s) -->
      <div
        id="scene-cumplimiento"
        class="clip"
        data-start="32"
        data-duration="13"
        data-composition-id="scene-cumplimiento-host"
        data-composition-src="compositions/frames/04-cumplimiento.html"
        data-track-index="1"
      ></div>

      <!-- Scene 5: Asesoría (45–52s) -->
      <div
        id="scene-asesoria"
        class="clip"
        data-start="45"
        data-duration="7"
        data-composition-id="scene-asesoria-host"
        data-composition-src="compositions/frames/05-asesoria.html"
        data-track-index="1"
      ></div>

      <!-- Scene 6: CTA (52–60s) -->
      <div
        id="scene-cta"
        class="clip"
        data-start="52"
        data-duration="8"
        data-composition-id="scene-cta-host"
        data-composition-src="compositions/frames/06-cta.html"
        data-track-index="1"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["clicklaboral-60s"] = tl;
    </script>
  </body>
</html>
