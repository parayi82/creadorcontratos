<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 400; font-style: normal; src: url('assets/fonts/pjs-400.woff2') format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 500; font-style: normal; src: url('assets/fonts/pjs-500.woff2') format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 600; font-style: normal; src: url('assets/fonts/pjs-600.woff2') format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 700; font-style: normal; src: url('assets/fonts/pjs-700.woff2') format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      #root {
        width: 1920px;
        height: 1080px;
        position: relative;
        container-type: size;
        overflow: hidden;
        background: #FFFFFF;
      }

      /* Diagonal cobalt-tint atmosphere panel */
      .atm-panel {
        position: absolute;
        top: 0;
        right: 0;
        width: 40%;
        height: 100%;
        background: rgba(0, 90, 200, 0.04);
        clip-path: polygon(15% 0%, 100% 0%, 100% 100%, 0% 100%);
      }

      /* 3×3 dot grid */
      .dot-grid {
        position: absolute;
        top: 5cqh;
        right: 4cqw;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5cqw;
        opacity: 0.3;
      }
      .dot {
        width: 0.5cqw;
        height: 0.5cqw;
        border-radius: 50%;
        background: #005AC8;
        min-width: 8px;
        min-height: 8px;
      }

      /* Accent line */
      #accent-line {
        position: absolute;
        top: 16cqh;
        left: 5cqw;
        width: 3.125cqw;
        height: 0.37cqh;
        background: #005AC8;
        border-radius: 2px;
        transform-origin: left center;
      }

      /* Eyebrow */
      #eyebrow {
        position: absolute;
        top: 18.5cqh;
        left: 5cqw;
        font-size: 0.8cqw;
        font-weight: 600;
        color: #005AC8;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* Question */
      #question {
        position: absolute;
        top: 26cqh;
        left: 5cqw;
        width: 52cqw;
        font-size: 2.6cqw;
        font-weight: 600;
        color: #1D1D1F;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      /* Impact number */
      #amount {
        position: absolute;
        top: 47cqh;
        left: 5cqw;
        font-size: 6.5cqw;
        font-weight: 700;
        color: #005AC8;
        line-height: 1.0;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }

      /* Subtitle below number */
      #subtitle {
        position: absolute;
        top: 70cqh;
        left: 5cqw;
        width: 45cqw;
        font-size: 1.25cqw;
        font-weight: 400;
        color: #767676;
        line-height: 1.5;
      }

      /* Progress bar track */
      .progress-track {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: rgba(0, 90, 200, 0.08);
      }
      #progress-fill {
        height: 100%;
        background: #005AC8;
        width: 0%;
      }

      /* Frame counter */
      .frame-counter {
        position: absolute;
        bottom: 1.5cqh;
        left: 5cqw;
        font-size: 0.7cqw;
        font-weight: 500;
        color: #767676;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="01-problema"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <!-- Atmosphere -->
      <div class="atm-panel"></div>
      <div class="dot-grid">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>

      <!-- Content clips -->
      <div id="accent-line" class="clip" data-start="0" data-duration="8" data-track-index="1"></div>

      <div id="eyebrow" class="clip" data-start="0" data-duration="8" data-track-index="2">
        RIESGO LABORAL
      </div>

      <div id="question" class="clip" data-start="0" data-duration="8" data-track-index="3">
        ¿Cuánto le costaría a tu empresa una demanda laboral?
      </div>

      <div id="amount" class="clip" data-start="0" data-duration="8" data-track-index="4">
        $800,000 MXN
      </div>

      <div id="subtitle" class="clip" data-start="0" data-duration="8" data-track-index="5">
        costo promedio de una demanda laboral en México — entre indemnizaciones, honorarios y daño reputacional
      </div>

      <!-- Chrome -->
      <div class="frame-counter">1 / 4</div>
      <div class="progress-track">
        <div id="progress-fill"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Accent line wipe in
      tl.from("#accent-line", { scaleX: 0, transformOrigin: "left center", duration: 0.5, ease: "power3.out" }, 0);

      // Eyebrow fade up
      tl.from("#eyebrow", { opacity: 0, y: 16, duration: 0.4, ease: "power2.out" }, 0.3);

      // Question slides up
      tl.from("#question", { opacity: 0, y: 40, duration: 0.7, ease: "power2.out" }, 0.6);

      // Amount slams in with scale
      tl.from("#amount", { opacity: 0, scale: 1.35, duration: 0.7, ease: "back.out(1.4)" }, 2.2);

      // Subtitle fades in
      tl.from("#subtitle", { opacity: 0, y: 20, duration: 0.6, ease: "power2.out" }, 3.4);

      // Progress bar grows from 0% to 17.8% over 8s
      tl.fromTo("#progress-fill", { width: "0%" }, { width: "17.8%", duration: 8, ease: "none" }, 0);

      window.__timelines["01-problema"] = tl;
    </script>
  </body>
</html>
