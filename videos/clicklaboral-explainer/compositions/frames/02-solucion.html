<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 400; font-style: normal; src: url('assets/fonts/pjs-400.woff2') format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 500; font-style: normal; src: url('assets/fonts/pjs-500.woff2') format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 600; font-style: normal; src: url('assets/fonts/pjs-600.woff2') format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 700; font-style: normal; src: url('assets/fonts/pjs-700.woff2') format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      #root {
        width: 1920px;
        height: 1080px;
        position: relative;
        container-type: size;
        overflow: hidden;
        background: #FFFFFF;
      }

      /* Slide header */
      #slide-header {
        position: absolute;
        top: 6cqh;
        left: 5cqw;
        right: 5cqw;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #eyebrow {
        font-size: 0.8cqw;
        font-weight: 600;
        color: #005AC8;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #tag-pill {
        font-size: 0.7cqw;
        font-weight: 500;
        color: #005AC8;
        background: rgba(0, 90, 200, 0.08);
        border-radius: 100px;
        padding: 0.4cqh 1.2cqw;
      }

      /* Heading */
      #heading {
        position: absolute;
        top: 15cqh;
        left: 5cqw;
        width: 60cqw;
        font-size: 2.6cqw;
        font-weight: 600;
        color: #1D1D1F;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      /* Left column — metric ring */
      #metric-col {
        position: absolute;
        top: 28cqh;
        left: 5cqw;
        width: 30cqw;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #ring-container {
        position: relative;
        width: 18cqw;
        height: 18cqw;
      }

      #ring-svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      #ring-track {
        fill: none;
        stroke: rgba(0, 90, 200, 0.1);
        stroke-width: 24;
      }

      #ring-fill {
        fill: none;
        stroke: #005AC8;
        stroke-width: 24;
        stroke-linecap: round;
        stroke-dasharray: 1005;
        stroke-dashoffset: 1005;
      }

      #metric-label {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      #metric-value {
        font-size: 3.2cqw;
        font-weight: 700;
        color: #005AC8;
        line-height: 1.0;
        font-variant-numeric: tabular-nums;
        display: block;
      }

      #metric-desc {
        font-size: 0.75cqw;
        font-weight: 500;
        color: #767676;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        display: block;
        margin-top: 0.4cqh;
        text-align: center;
      }

      /* Right column — checks */
      #checks-col {
        position: absolute;
        top: 28cqh;
        left: 38cqw;
        width: 50cqw;
        display: flex;
        flex-direction: column;
        gap: 2.5cqh;
      }

      .check-item {
        display: flex;
        align-items: center;
        gap: 1.5cqw;
        padding: 2.2cqh 2cqw;
        background: rgba(0, 90, 200, 0.04);
        border: 1.5px solid rgba(0, 90, 200, 0.2);
        border-radius: 14px;
      }

      .check-icon {
        width: 3.5cqw;
        height: 3.5cqw;
        background: #005AC8;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .check-icon svg {
        width: 1.8cqw;
        height: 1.8cqw;
      }

      .check-text {
        display: flex;
        flex-direction: column;
        gap: 0.3cqh;
      }

      .check-title {
        font-size: 1.6cqw;
        font-weight: 700;
        color: #005AC8;
        letter-spacing: -0.01em;
      }

      .check-sub {
        font-size: 0.85cqw;
        font-weight: 400;
        color: #767676;
      }

      /* Progress bar */
      .progress-track {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: rgba(0, 90, 200, 0.08);
      }
      #progress-fill { height: 100%; background: #005AC8; width: 0%; }

      .frame-counter {
        position: absolute;
        bottom: 1.5cqh;
        left: 5cqw;
        font-size: 0.7cqw;
        font-weight: 500;
        color: #767676;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="02-solucion"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <!-- Slide header -->
      <div id="slide-header" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <span id="eyebrow">SOLUCIÓN</span>
        <span id="tag-pill">AUTOMÁTICO</span>
      </div>

      <!-- Heading -->
      <div id="heading" class="clip" data-start="0" data-duration="12" data-track-index="2">
        ClickLaboral monitorea LFT, IMSS y STPS automáticamente
      </div>

      <!-- Metric ring (left) -->
      <div id="metric-col" class="clip" data-start="0" data-duration="12" data-track-index="3">
        <div id="ring-container">
          <svg id="ring-svg" viewBox="0 0 340 340">
            <circle id="ring-track" cx="170" cy="170" r="160" />
            <circle id="ring-fill" cx="170" cy="170" r="160" />
          </svg>
          <div id="metric-label">
            <span id="metric-value">97%</span>
            <span id="metric-desc">Cumplimiento</span>
          </div>
        </div>
      </div>

      <!-- Compliance checks (right) -->
      <div id="checks-col" class="clip" data-start="0" data-duration="12" data-track-index="4">
        <div class="check-item" id="check-lft">
          <div class="check-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="check-text">
            <span class="check-title">LFT</span>
            <span class="check-sub">Ley Federal del Trabajo — monitoreo continuo</span>
          </div>
        </div>
        <div class="check-item" id="check-imss">
          <div class="check-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="check-text">
            <span class="check-title">IMSS</span>
            <span class="check-sub">Instituto Mexicano del Seguro Social — al día</span>
          </div>
        </div>
        <div class="check-item" id="check-stps">
          <div class="check-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="check-text">
            <span class="check-title">STPS</span>
            <span class="check-sub">Secretaría del Trabajo — alertas de reformas</span>
          </div>
        </div>
      </div>

      <!-- Chrome -->
      <div class="frame-counter">2 / 4</div>
      <div class="progress-track">
        <div id="progress-fill"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Slide header
      tl.from("#slide-header", { opacity: 0, y: -20, duration: 0.5, ease: "power2.out" }, 0);

      // Heading slides up
      tl.from("#heading", { opacity: 0, y: 30, duration: 0.7, ease: "power2.out" }, 0.4);

      // Metric column fades in
      tl.from("#metric-col", { opacity: 0, scale: 0.9, duration: 0.7, ease: "back.out(1.2)" }, 0.8);

      // Ring fill draws
      tl.to("#ring-fill", { strokeDashoffset: 1005 * (1 - 0.97), duration: 1.8, ease: "power3.out" }, 1.2);

      // Metric value counts up (simulated with opacity)
      tl.from("#metric-value", { opacity: 0, duration: 0.3 }, 1.2);

      // Checks stagger in from right
      tl.from("#check-lft",  { opacity: 0, x: 60, duration: 0.55, ease: "power2.out" }, 2.0);
      tl.from("#check-imss", { opacity: 0, x: 60, duration: 0.55, ease: "power2.out" }, 2.7);
      tl.from("#check-stps", { opacity: 0, x: 60, duration: 0.55, ease: "power2.out" }, 3.4);

      // Progress bar 17.8% → 44.4%
      tl.fromTo("#progress-fill", { width: "17.8%" }, { width: "44.4%", duration: 12, ease: "none" }, 0);

      window.__timelines["02-solucion"] = tl;
    </script>
  </body>
</html>
